[fpc_rig]
; TS4 VR mod settings. Everything here can also be changed in game: press DEL (or hold the left menu button).
; Key names: F1..F24, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, CAPSLOCK, PAUSE, SCROLLLOCK, NUMPAD0..9,
; LALT, RALT, LCTRL, RCTRL, LSHIFT, RSHIFT, SPACE, TAB, VIRGULA (comma), PONTO (period), CEDILHA, a letter, or hex (0x2D).

; ---- keys
tecla_modo_fps=INSERT
tecla_config=DELETE
tecla_recentrar=VIRGULA
tecla_painel_vr=PONTO
tecla_esconder_corpo=END
tecla_correr=LALT
inverter_A_D=0

; ---- VR (1 = on). vr_estereo: 0 = virtual screen, 1 = one eye per frame, 2 = both eyes every frame (recommended)
vr=1
vr_estereo=2
vr_rastrear_cabeca=1
vr_escala_mundo=1.0
vr_tela_largura=2.4
vr_tela_distancia=2.2

; ---- image: vr_upscaler 0 = off (direct copy), 1 = bilinear, 2 = FSR 1.0, 3 = CAS
vr_upscaler=2
vr_supersampling=1.0
vr_nitidez=0.6
; game resolution preset: 0 = current window, 1 = native, 2 = ultra quality, 3 = quality, 4 = balanced, 5 = performance, 6 = custom
vr_preset=0
vr_resolucao_jogo=1.0
vr_fov_simetrico=0

; ---- comfort: vr_giro_passos 0 = smooth turn, 1 = snap turn. vr_vinheta 0..3 = off/light/medium/strong
vr_giro_passos=0
vr_giro_velocidade=120
vr_giro_passo=30
vr_zona_morta=0.20
vr_vinheta=0
envios_por_segundo=120
giro_corpo_velocidade=10

; ---- body: vr_bracos 0 = off, 1 = outside interactions, 2 = always
vr_bracos=1
vr_cabeca=1
vr_cabeca_limite=80
vr_dedos=1
vr_pernas=1
vr_agachar=1
vr_inclinar=1
avatar_cliente=1
agarrar=1
agarrar_objetos=1

; ---- interface
laser=1
laser_mao=DIREITA
laser_visivel=1
ui_separada=1
ui_mundo=1
menu_vr=1
relogio=1
